name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: telemedicine_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d telemedicine_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/telemedicine_ci?schema=public
      JWT_ACCESS_SECRET: ci-only-access-secret-not-for-production
      JWT_REFRESH_SECRET: ci-only-refresh-secret-not-for-production
      SETTINGS_ENCRYPTION_KEY: ci-only-encryption-key-not-for-production
      DEFAULT_DOCTOR_PASSWORD: CiOnlyDoctorPassword123!
      GOOGLE_MEET_ENABLED: "false"
      FIREBASE_PUSH_ENABLED: "false"
      FIREBASE_PHONE_AUTH_ENABLED: "false"
      EMAIL_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm run test:typecheck
      - name: Run tests sequentially against the isolated database
        run: npx tsx --test --test-concurrency=1 tests/*.test.ts
      - run: npm run build
